limit_req_zone $binary_remote_addr zone=fantasytales_api:10m rate=10r/s;
server {
    listen 80;
    listen [::]:80;
    server_name fantasytales.org www.fantasytales.org;
    server_tokens off;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://fantasytales.org$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.fantasytales.org;
    ssl_certificate /etc/letsencrypt/live/fantasytales.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fantasytales.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    return 301 https://fantasytales.org$request_uri;
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fantasytales.org;
    ssl_certificate /etc/letsencrypt/live/fantasytales.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fantasytales.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    server_tokens off;
    client_max_body_size 16k;
    access_log /var/log/nginx/fantasytales-access.log;
    error_log /var/log/nginx/fantasytales-error.log warn;
    include /etc/nginx/fantasytales-locations/*.conf;
    location /api/ {
        limit_req zone=fantasytales_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 20s;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 20s;
    }
}
