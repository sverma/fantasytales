limit_req_zone $binary_remote_addr zone=fantasytales_api:10m rate=10r/s;
# This file is included from nginx.conf's http context. Only the explicitly
# public asset location below uses this bounded cache; all other proxies are off.
proxy_cache_path /var/cache/nginx/fantasytales-static levels=1:2
    keys_zone=fantasytales_static:2m max_size=64m inactive=2h use_temp_path=off;
server {
    listen 80;
    listen [::]:80;
    server_name fantasytales.org www.fantasytales.org;
    server_tokens off;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://fantasytales.org$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.fantasytales.org;
    ssl_certificate /etc/letsencrypt/live/fantasytales.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fantasytales.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    return 301 https://fantasytales.org$request_uri;
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fantasytales.org;
    ssl_certificate /etc/letsencrypt/live/fantasytales.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fantasytales.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    server_tokens off;
    client_max_body_size 16k;
    access_log /var/log/nginx/fantasytales-access.log;
    error_log /var/log/nginx/fantasytales-error.log warn;
    include /etc/nginx/fantasytales-locations/*.conf;
    location ~ ^/(?:app\.js|styles\.css|landing\.js|landing\.css|favicon\.svg|assets/[a-zA-Z0-9_-]+\.(?:woff2|svg))$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        # These URLs are public and never personalized. Do not let credentials
        # influence a response that will be shared between visitors.
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        # Cache one uncompressed representation; gzip is negotiated below.
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 20s;
        proxy_cache fantasytales_static;
        proxy_cache_key "$scheme|$host|$request_uri";
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 1h;
        proxy_cache_lock on;
        proxy_cache_revalidate on;
        # Keep upstream no-store/private/Set-Cookie safeguards and browser TTL.
        # Query strings stay in the key so ?v= changes take effect immediately.
        add_header X-Static-Cache $upstream_cache_status always;
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 5;
        gzip_min_length 1024;
        gzip_types text/css application/javascript text/javascript image/svg+xml;
    }
    location /api/ {
        proxy_cache off;
        limit_req zone=fantasytales_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 20s;
    }
    location / {
        proxy_cache off;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 20s;
    }
}
