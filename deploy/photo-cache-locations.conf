# Include inside the canonical HTTPS server. Requires http_auth_request_module.
# Keep the authorization subrequest private and NEVER cache its response.
location = /_fantasytales_photo_auth {
    internal;
    proxy_pass http://127.0.0.1:3000/api/media-authorize;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache off;
    proxy_read_timeout 10s;
}
location = /api/media-authorize { return 404; }

# Original files and every other URL retain their existing protected, uncached route.
location ~ "^/media/[a-z]+/(?:portrait|photo-[0-9]{2})\.(?:jpg|png)/[a-f0-9]{32}-(?:128|480|960|1440)\.webp$" {
    auth_request /_fantasytales_photo_auth;
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Authorization "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Accept-Encoding "";
    proxy_read_timeout 30s;
    proxy_cache fantasytales_photos;
    # Validated content revision and size are in the path. Query strings cannot
    # alter these bytes and are deliberately omitted to prevent cache duplication.
    proxy_cache_key "$scheme|$host|$uri";
    proxy_cache_methods GET HEAD;
    proxy_cache_valid 200 24h;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 30s;
    # This exception applies ONLY after a fresh, uncached authorization succeeds.
    # Keep Set-Cookie and Vary safeguards; never cache errors or use stale on errors.
    proxy_ignore_headers Cache-Control Expires;
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    add_header Cache-Control "private, no-store" always;
    add_header X-Photo-Cache $upstream_cache_status always;
    add_header X-Robots-Tag "noindex, noimageindex, noarchive" always;
    add_header X-Content-Type-Options nosniff always;
}
