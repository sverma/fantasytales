# This Node application has no PHP, WordPress, CGI, or public secret-file routes.
# Match the actual socket IP at the start of Nginx's combined access log.
# Never match arbitrary 404s, authentication failures, rate limits, query text,
# referrers, or user agents. Only repeated requests for the paths below count.
[Definition]
failregex = ^<HOST> - \S+ \[[^\]]*\] "(?:GET|HEAD|POST|PUT|DELETE|OPTIONS|PATCH) /(?:[^?\s"]*/)?(?:\.env(?:\.[^/?\s"]+)?|\.git(?:/[^?\s"]*)?|\.svn(?:/[^?\s"]*)?|\.aws/credentials|\.ssh/[^?\s"]+|id_rsa)(?:\?[^\s"]*)? HTTP/\d(?:\.\d)?" (?:301|302|400|401|403|404|405|444) \S+(?:\s|$)
            ^<HOST> - \S+ \[[^\]]*\] "(?:GET|HEAD|POST|PUT|DELETE|OPTIONS|PATCH) /(?:[^?\s"]*/)?(?:wp-(?:admin|includes|content)(?:/[^?\s"]*)?|[^/?\s"]+\.php(?:/[^?\s"]*)?)(?:\?[^\s"]*)? HTTP/\d(?:\.\d)?" (?:301|302|400|401|403|404|405|444) \S+(?:\s|$)
            ^<HOST> - \S+ \[[^\]]*\] "(?:GET|HEAD|POST|PUT|DELETE|OPTIONS|PATCH) /(?:cgi-bin|boaform|HNAP1|actuator)(?:/[^?\s"]*)?(?:\?[^\s"]*)? HTTP/\d(?:\.\d)?" (?:301|302|400|401|403|404|405|444) \S+(?:\s|$)
ignoreregex =
